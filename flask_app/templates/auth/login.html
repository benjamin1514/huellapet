{% extends 'base.html' %}

{% block titulo %}Huellapet | Iniciar sesión{% endblock %}

{% block contenido %}
<main class="pagina pagina-centrada">
    <section class="card caja-acceso">
        <span class="acceso-icono"><svg><use href="#i-user"></use></svg></span>
        <h1>Iniciar sesión</h1>
        <p class="suave">Colegiado N° {{ session.get('colegiado') }}</p>

        <form method="post" class="formulario-simple">
            <label class="campo">Correo
                <input type="email" name="email" required autofocus>
            </label>
            <label class="campo">Contraseña
                <input type="password" name="password" required>
            </label>
            <button class="boton boton-turquesa" type="submit">Entrar<svg><use href="#i-chevron"></use></svg></button>
        </form>
    </section>
</main>
{% endblock %}
