<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <main class="container py-4">{% with ms=get_flashed_messages(with_categories=true) %}{% for c,m in ms %}<div
            class="alert alert-{{c}}">{{m}}</div>{% endfor %}{% endwith %}<h1>Crear cuenta</h1>
        <form method="post"><input class="form-control mb-2" name="nombre" placeholder="Nombre" required><input
                class="form-control mb-2" type="email" name="email" placeholder="Correo" required><input
                class="form-control mb-2" type="password" name="password" placeholder="Contraseña" required><input
                class="form-control mb-2" name="telefono" placeholder="Teléfono"><input class="form-control mb-2"
                name="direccion" placeholder="Dirección"><button class="btn btn-primary">Registrarse</button></form>
    </main>
</body>

</html>
