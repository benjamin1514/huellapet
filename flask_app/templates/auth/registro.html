{% extends 'base.html' %}

{% block titulo %}Huellapet | Registro de veterinario{% endblock %}

{% block contenido %}
<main class="pagina pagina-centrada">
    <section class="card caja-acceso">
        <span class="acceso-icono"><svg><use href="#i-plus"></use></svg></span>
        <h1>Registro de veterinario</h1>

        <form method="post" class="formulario-simple">
            <label class="campo">Nombre completo
                <input type="text" name="nombre" required autofocus>
            </label>
            <label class="campo">Número de colegiado
                <input type="text" name="numero_colegiado" required>
            </label>
            <label class="campo">Especialidad
                <input type="text" name="especialidad">
            </label>
            <label class="campo">Correo
                <input type="email" name="email" required>
            </label>
            <label class="campo">Teléfono
                <input type="text" name="telefono">
            </label>
            <label class="campo">Contraseña
                <input type="password" name="password" required>
            </label>
            <button class="boton boton-turquesa" type="submit">Crear cuenta<svg><use href="#i-chevron"></use></svg></button>
        </form>
    </section>
</main>
{% endblock %}
