<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Documentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <main class="container py-4">{% with ms=get_flashed_messages(with_categories=true) %}{% for c,m in ms %}<div
            class="alert alert-{{c}}">{{m}}</div>{% endfor %}{% endwith %}<h1>Documentos privados de {{ mascota.nombre
            }}</h1>{% for d in documentos %}<p>{{ d.nombre_doc }} — {{ d.tipo }}</p>{% else %}<p>Sin documentos.</p>{%
        endfor %}</main>
</body>

</html>
